- name: zen.tabs.vertical
  value: true

# SYNAPSE: tabs across the top of the window (address bar and bookmarks below).
- name: synapse.tabs.top
  value: true

- name: zen.tabs.vertical.right-side
  value: false

- name: zen.tabs.rename-tabs
  value: true

- name: zen.tabs.essentials.max
  value: 12

- name: zen.tabs.show-newtab-vertical
  value: true

- name: zen.tabs.close-window-with-empty
  value: true

- name: zen.tabs.select-recently-used-on-close
  value: true

- name: zen.tabs.folder-dragover-threshold-percent
  value: 20 # Percentage of folder height to trigger dragover

- name: zen.tabs.dnd-switch-space-delay
  value: 500 # milliseconds

- name: zen.ctrlTab.show-pending-tabs
  value: false

- name: zen.mediacontrols.enabled
  value: true

- name: zen.haptic-feedback.enabled
  value: true

- name: zen.startup.smooth-scroll-in-tabs
  value: false

- name: zen.tabs.open-pinned-in-new-tab
  value: true

- name: zen.tabs.close-on-back-with-no-history
  value: true

- name: zen.tabs.ctrl-tab.ignore-essential-tabs
  value: false

- name: zen.tabs.ctrl-tab.ignore-pending-tabs
  value: false

# SYNAPSE Browser: fewer animations for higher FPS on low-power PCs
- name: ui.prefersReducedMotion
  value: 1

- name: toolkit.cosmeticAnimations.enabled
  value: false

# SYNAPSE Browser: keep RAM low (fewer content processes, early tab unloading, small caches)
- name: dom.ipc.processCount
  value: 2

- name: dom.ipc.processCount.webIsolated
  value: 1

- name: dom.ipc.processPrelaunch.enabled
  value: false

- name: browser.tabs.unloadOnLowMemory
  value: true

- name: browser.low_commit_space_threshold_percent
  value: 25

- name: browser.tabs.min_inactive_duration_before_unload
  value: 300000

- name: browser.sessionhistory.max_total_viewers
  value: 0

- name: browser.cache.memory.capacity
  value: 32768

- name: media.memory_cache_max_size
  value: 32768

- name: image.mem.surfacecache.max_size_kb
  value: 131072

- name: browser.newtab.preload
  value: false

- name: network.prefetch-next
  value: false

- name: network.dns.disablePrefetch
  value: false

- name: network.predictor.enabled
  value: true

- name: extensions.pocket.enabled
  value: false
