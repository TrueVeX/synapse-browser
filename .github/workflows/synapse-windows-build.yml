# SYNAPSE Browser (HumanForm Studios) - Windows x64 build on GitHub-hosted runners.
# Adapted from windows-release-build.yml: x86_64 only, no PGO, no LTO, so it fits the
# 6-hour limit of a free ubuntu-latest runner. Cross-compiles Windows from Linux.
name: SYNAPSE Windows Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      use-sccache:
        description: "Use sccache (speeds up re-runs)"
        type: boolean
        default: true

jobs:
  windows-x64:
    name: Build SYNAPSE Browser - Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: ${{ inputs.use-sccache && 'true' || 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      SURFER_COMPAT: x86_64
      BUILD_VERSION: "1.0.0"
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@main
        if: ${{ inputs.use-sccache }}
        with:
          disable_annotations: true

      - name: Expose actions cache variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y python3 python3-pip dos2unix yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb lld llvm --fix-missing

      - name: Load Surfer CI setup
        run: npm run surfer -- ci --brand release --display-version "$BUILD_VERSION"

      - name: Download Firefox source
        run: npm run download

      - name: Setup Windows cross-compile toolchain (wine + Visual Studio)
        run: |
          set -x
          mkdir -p ~/win-cross
          cd engine/
          sudo apt-get -o Acquire::Retries=3 install -y python3-launchpadlib
          sudo add-apt-repository -y ppa:savoury1/backports
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y python3-pip autoconf autoconf2.13 automake bison \
            build-essential cabextract curl cmake flex gawk gcc-multilib git gnupg jq libbz2-dev \
            libexpat1-dev libffi-dev libncursesw5-dev libsqlite3-dev libssl-dev libtool libucl-dev \
            libxml2-dev msitools ninja-build openssh-client p7zip-full pkg-config procps \
            python3-requests python3-toml scons subversion tar unzip uuid uuid-dev wget zip zlib1g-dev aria2
          aria2c "https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.cache.level-3.toolchains.v3.linux64-wine.latest/artifacts/public/build/wine.tar.zst" -o wine.tar.zst
          tar --zstd -xf wine.tar.zst -C ~/win-cross
          rm wine.tar.zst
          ./mach python --virtualenv build taskcluster/scripts/misc/get_vs.py build/vs/vs2026.yaml ~/win-cross/vs2026

      - name: Import patches and branding
        run: |
          . "$HOME/.cargo/env"
          npm run import -- --verbose

      - name: Bootstrap
        run: |
          set -x
          chmod -R +x "$(echo ~)/win-cross/vs2026" || true
          export SURFER_PLATFORM="win32"
          npm run bootstrap
          echo "export LIB=\"$(cd ~/.mozbuild/clang/lib/clang/* && cd lib/windows && pwd)\"" >> configs/common/mozconfig

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          source $HOME/.cargo/env
          rustup target add x86_64-pc-windows-msvc
          WINDOWS_RS_VERSION=$(cat build/windows/.windows-rs-version)
          curl -fsSL "https://static.crates.io/crates/cargo-download/cargo-download-0.1.2.crate" | tar xz -C /tmp
          (cd /tmp/cargo-download-0.1.2 && cargo generate-lockfile && cargo update tinyvec --precise 1.12.0)
          RUSTFLAGS="--cap-lints=allow" cargo install --path /tmp/cargo-download-0.1.2 --locked
          cd engine/
          cargo download -x windows=$WINDOWS_RS_VERSION
          echo "" >> ../configs/common/mozconfig
          echo "export MOZ_WINDOWS_RS_DIR=$(pwd)/windows-$WINDOWS_RS_VERSION" >> ../configs/common/mozconfig

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Build
        env:
          ZEN_RELEASE_BRANCH: release
        run: |
          set -x
          dos2unix configs/windows/mozconfig configs/common/mozconfig
          export SURFER_PLATFORM="win32"
          export ZEN_CROSS_COMPILING=1
          export ZEN_GA_DISABLE_PGO=1
          export ZEN_DISABLE_LTO=1
          df -h
          bash .github/workflows/src/release-build.sh

      - name: Package
        env:
          ZEN_GA_DISABLE_PGO: true
        run: |
          set -x
          export SURFER_PLATFORM="win32"
          export ZEN_CROSS_COMPILING=1
          export ZEN_RELEASE=1
          npm run package
          ls -la ./dist
          mkdir -p out
          cp "$(ls ./dist/*.en-US.win64.zip | head -n1)" out/synapse-browser-win64.zip
          # Ship the FULL offline installer, never the *-stub / *.pretty.exe one
          # (the stub downloads the browser from upstream servers).
          INSTALLER=./dist/synapse.installer.exe
          SIZE=$(stat -c %s "$INSTALLER")
          if [ "$SIZE" -lt 50000000 ]; then echo "Installer is only $SIZE bytes: not the full installer" >&2; exit 1; fi
          cp "$INSTALLER" out/synapse-browser-setup.exe

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: synapse-browser-win64-zip
          path: out/synapse-browser-win64.zip
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@v4
                with:
          name: synapse-browser-setup-exe
          path: out/synapse-browser-setup.exe
          retention-days: 14
